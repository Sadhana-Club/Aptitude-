<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<title>BrainGate – Enter the Challenge</title>
<link rel="icon" href="logo.png">

<style>
body {
    font-family: 'Raleway', sans-serif;
    background: linear-gradient(135deg, #ff7f50, #00bfff, #6a5acd);
}

/* ================= EXISTING STYLES (UNCHANGED) ================= */

.wrapper {
    width: 800px;
    height: 600px;
    position: relative;
    margin: 3% auto;
    box-shadow: 2px 18px 70px 0px #9D9D9D;
    overflow: hidden;
}

.login-text {
    width: 800px;
    height: 450px;
    background: linear-gradient(to left, #ab68ca, #de67a3);
    position: absolute;
    top: -300px;
    padding: 6%;
    transition: all 0.5s ease-in-out;
    z-index: 11;
}

.text {
    margin-left: 20px;
    color: #fff;
    display: none;
}

.text input {
    margin-top: 30px;
    height: 40px;
    width: 300px;
    border: none;
    background-color: #444;
    opacity: 0.6;
    color: #fff;
    padding-left: 10px;
}

.login-btn {
    background: #fff;
    border: none;
    border-radius: 2px;
    color: #696a86;
    margin-top: 40px;
}

.show-hide { display: block; }
.expand { transform: translateY(300px); }

/* ================= POPUP STYLES (ISOLATED) ================= */

.rules-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}

.rules-box {
    background: #fff;
    width: 420px;
    padding: 25px;
    border: 3px solid skyblue;
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(0,0,0,0.35);
    position: relative;
}

.rules-box h2 {
    text-align: center;
    margin-top: 0;
    color: #333;
}

.rules-box ul {
    padding-left: 20px;
}

.rules-box li {
    margin: 8px 0;
    color: #444;
}

.rules-close {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 22px;
    cursor: pointer;
}

.rules-close:hover {
    color: red;
}

.rules-ok {
    display: block;
    margin: 15px auto 0;
    background: skyblue;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.rules-ok:hover {
    background: deepskyblue;
}
.button-18 {
  align-items: center;
  background-color: #fff;
  border: 0;
  border-radius: 100px;
  box-sizing: border-box;
  cursor: pointer;
  display: inline-flex;
  font-family: -apple-system, system-ui, system-ui, "Segoe UI", Roboto, "Helvetica Neue", "Fira Sans", Ubuntu, Oxygen, "Oxygen Sans", Cantarell, "Droid Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Lucida Grande", Helvetica, Arial, sans-serif;
  font-size: 16px;
  font-weight: 600;
  justify-content: center;
  line-height: 20px;
  max-width: 480px;
  min-height: 40px;
  min-width: 0px;
  overflow: hidden;
  padding: 0px;
  padding-left: 20px;
  padding-right: 20px;
  text-align: center;
  touch-action: manipulation;
  transition: background-color 0.167s cubic-bezier(0.4, 0, 0.2, 1) 0s, box-shadow 0.167s cubic-bezier(0.4, 0, 0.2, 1) 0s, color 0.167s cubic-bezier(0.4, 0, 0.2, 1) 0s;
  user-select: none;
  -webkit-user-select: none;
  vertical-align: middle;
}

.button-18:hover,
.button-18:focus { 
  background-color: #8bf0e9;
}

.button-18:active {
  background: #09223b;
  color: rgb(255, 255, 255, .7);
}

.button-18:disabled { 
  cursor: not-allowed;
  background: rgba(0, 0, 0, .08);
  color: rgba(0, 0, 0, .3);
}
</style>
</head>

<body>

<!-- ================= RULES POPUP ================= -->

<div id="rulesPopup" class="rules-overlay">
    <div class="rules-box">
        <span class="rules-close" onclick="closeRules()">×</span>

        <h2>Aptitude Test Rules</h2>
        <ul>
            <li>Login into your Gmail account before proceeding</li>
            <li>Each question carries 1 mark</li>
            <li>No negative marking</li>
            <li>Do not refresh or leave the page</li>
            <li>The test is time bound, submit before timer ends</li>
        </ul>

        <button class="rules-ok" onclick="closeRules()">I Understand</button>
    </div>
</div>

<!-- ================= EXISTING LOGIN UI ================= -->

<div class="wrapper" id="scriptButton">
    <div class="login-text">
        <div class="text">
            <h1>BrainGate – Enter the Challenge!</h1>
            <br>

            <form id="loginForm" onsubmit="return captureLoginData(event)">
                <input type="text" id="username" placeholder="Username" required><br>
                <input type="password" id="password" placeholder="Password" required><br><br><br>
                <button class="button-18" type="submit">Log In</button>
            </form>

            <div id="error-message"></div>
        </div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->

<script>
const VALID_USER = "sadhana";
const VALID_PASS = "MCA@2026";

/* AUTO SHOW RULES */
window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("rulesPopup").style.display = "flex";

    const loginText = document.querySelector(".login-text");
    const text = document.querySelector(".login-text .text");

    loginText.classList.add("expand");
    text.classList.add("show-hide");
});

/* CLOSE RULES */
function closeRules() {
    document.getElementById("rulesPopup").style.display = "none";
}

/* LOGIN CHECK */
function captureLoginData(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (username === VALID_USER && password === VALID_PASS) {
        sessionStorage.setItem("loggedIn", "true");
        window.location.href = "form.html";
    } else {
        document.getElementById("error-message").textContent =
            "Invalid username or password.";
    }
    return false;
}
</script>

</body>
</html>
