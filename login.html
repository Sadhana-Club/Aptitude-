<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainGate - Enter the Challenge</title>
<link rel="stylesheet" href="css/login.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="pages1/logo.png" type="image/x-icon">
    <link rel="icon" href="pages1/logo.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="pages1/logo.png">
    <link rel="icon" sizes="32x32" href="pages1/logo.png">
    <link rel="icon" sizes="16x16" href="pages1/logo.png">

</head>
<body>
<header class="modern-header" id="home">
    <div class="header-top">
        <img src="pages1/clogo-removebg-preview.png" class="logo-left">

        <div class="club-brand">
            <h1>SADHANA</h1>
            <h2>THE IT CLUB</h2>
            <p class="club-motto">
                Internalize <span class="glow-dot">•</span>
                Empower <span class="glow-dot">•</span>
                Evolve
            </p>
        </div>

        <img src="pages1/logo.png" class="logo-right">
    </div>
</header>
<canvas id="dotCanvas"></canvas>
<div class="glow"></div>

<!-- Rules Popup -->
<div id="rulesPopup" class="rules-overlay">
    <div class="rules-box">
        <span class="rules-close" onclick="closeRules()">×</span>

        <h2>Aptitude Test Rules</h2>

        <ul>
            <li>Login into your Gmail account before proceeding</li>
            <li>Each question carries 1 mark</li>
            <li>No negative marking</li>
            <li>Do not refresh or leave the page</li>
            <li>Submit before the timer ends</li>
        </ul>

        <button class="rules-ok" onclick="closeRules()">
            I Understand
        </button>
    </div>
</div>
<main class="login-main">
<!-- Login -->
<div class="wrapper">

    <h1>BrainGate</h1>
    <p class="subtitle">Enter the Challenge</p>

    <form onsubmit="return captureLoginData(event)">
        <input
            type="text"
            id="username"
            placeholder="Username"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button class="button-18" type="submit">
            Log In
        </button>
    </form>

    <div id="error-message"></div>
</div>
</main>
<script src="js/login.js"></script>
</body>
</html>
